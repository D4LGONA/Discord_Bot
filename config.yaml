# ─────────────────────────────────────────────────────────────
#  게임 개발자 채용공고 봇 설정
# ─────────────────────────────────────────────────────────────

# 직군별 채널 ID. setup_channels.py 가 채널 이름으로 찾아 채워 준다.
# 비어 있는 직군은 .env 의 DISCORD_CHANNEL_ID 로 간다.
channels:
  기획: 1541444126413693018
  클라이언트: 1541444086731636856
  서버: 1541437977027289130
  아트: 1541444112861892728

schedule:
  # 매일 이 시각에 새 공고를 채널로 발송 (24시간제, 한국시간)
  # GitHub Actions 로 돌릴 때는 .github/workflows/daily.yml 의 cron 이 기준이다.
  hour: 6
  minute: 0
  timezone: Asia/Seoul
  # 봇을 처음 켰을 때 기존 공고 전체를 쏟아내지 않고 조용히 DB에만 적재
  seed_on_first_run: true

sources:
  gamejob: true     # 게임잡  - 메인. 게임 직군 분류가 정확함
  wanted: true      # 원티드  - 공식 JSON API. 최신 50건 상한
  saramin: true     # 사람인  - 키워드 검색 기반
  jobkorea: true    # 잡코리아 - React 렌더링이라 넷 중 가장 깨지기 쉬움

# 인턴/신입 지원가능으로 분류할 최대 요구경력 (년)
entry_max_years: 3

# true 면 경력 공고를 아예 버린다. 신입/인턴/경력무관/3년이하만 남는다.
# 게임잡은 서버쪽 필터까지 걸어서 경력 공고는 받아오지도 않는다.
only_entry: true

# 요청 사이 대기 (초). 너무 낮추면 차단당할 수 있음
request_delay: 0.7

# 한 번에 채널에 올릴 공고 수 상한 (직군당)
max_per_section: 25

# 전체 공고 열람 페이지. 디스코드 메시지 끝에 링크로 붙는다.
# GitHub Pages 를 안 쓸 거면 비워 두면 링크가 안 붙는다.
site_url: https://d4lgona.github.io/Discord_Bot/
