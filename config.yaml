# ─────────────────────────────────────────────────────────────
#  게임 개발자 채용공고 봇 설정
# ─────────────────────────────────────────────────────────────

schedule:
  # 매일 이 시각에 새 공고를 채널로 발송 (24시간제, 한국시간)
  hour: 6
  minute: 0
  timezone: Asia/Seoul
  # 봇을 처음 켰을 때 기존 공고 전체를 쏟아내지 않고 조용히 DB에만 적재
  seed_on_first_run: true

sources:
  gamejob:  true    # 게임잡  - 메인. 게임 직군 분류가 정확함
  wanted:   true    # 원티드  - 공식 JSON API, 연차 정보 정확
  saramin:  true    # 사람인  - 키워드 검색 기반
  jobkorea: true    # 잡코리아 - React 렌더링이라 넷 중 가장 깨지기 쉬움. 문제 생기면 false

# 인턴/신입 지원가능으로 분류할 최대 요구경력 (년)
entry_max_years: 3

# 요청 사이 대기 (초). 너무 낮추면 차단당할 수 있음
request_delay: 0.7

# 한 번에 채널에 올릴 공고 수 상한 (카테고리·구분당)
max_per_section: 25
