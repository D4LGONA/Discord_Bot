name: 채용공고 발송

on:
  schedule:
    # UTC 21:00 = 한국시간 06:00 (다음날)
    - cron: "0 21 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

# data/seen.txt 를 다시 커밋해야 하므로 쓰기 권한이 필요하다
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 및 발송
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python run_once.py

      - name: 전체 목록 페이지 생성
        run: python build_site.py

      - name: 발송 기록·페이지 저장
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.txt data/postings.json docs/index.html
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "발송 기록·목록 갱신 ($(date -u +%Y-%m-%d))"
            # 다른 실행이 먼저 밀어넣었을 수 있으니 rebase 후 푸시
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
